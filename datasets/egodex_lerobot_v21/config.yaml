dataset:
  name: egodex_lerobot_v21
  # Production part/task LeRobot root (matches egodex_22T.yaml).
  # For local smoke on a single converted task, override root + layout: single_root.
  root: /mnt/project_rlinf_hs/dreamzero_pretrain_data/22T_data/egodex_lerobot_v21
  embodiment: egodex
  fps: 30
  layout: part_task

pipeline:
  num_workers: 64
  export_workers: 64
  output_mode: both
  force_skip_gate: false
  parallel_videos: true
  recompute_video_stats: false
  sample_mode: sequential  # sequential | random (used with --sample-size)
  # ignore_episodes_paths: []  # add egodex-specific ignore JSON when available

media:
  target_height: 384  # legacy height resize when episode_geometry disabled
  target_short_side: 384  # v2: scale shorter side to 384
  max_keyframe_interval: 10  # ffmpeg -g / -keyint_min
  require_camera_top: true

episode_geometry:
  enabled: true
  module: episode_geometry
  episode_frame: "camera_reference at frame_index=0"
  video_short_side: 384
  source_calibration_size: [1920, 1080]  # EgoDex head camera
  # Source poses are already in episode_first_head_camera; P6 only writes extrinsics.
  poses_in_episode_frame: true
  cameras:
    reference: observation.images.camera_top
    aux: []
    mapping:
      camera_reference: camera_top
    wrist_view: []
  extrinsics:
    source: observation.camera_extrinsics_world  # per-frame 4x4 camera→world
    reference_is_fixed: false
  action:
    eef_source: action  # 20d xyz+rot6d+gripper x2
    eef_target_index: "min(t + lag, episode_length - 1)"
    eef_tail_policy: repeat final EEF state for tail rows

speed_align:
  enabled: true
  golden_embodiment: humanoid
  golden_speed_mps: 0.08
  target_fps: 30

# P4 TemporalAlign — read by orchestrator / pipeline
temporal_align:
  apply_delay: false
  mode: stats
  manual_delay: null

# Stage2: DA on standard eef keys; fill action.eef from state.eef when missing
stage2:
  fill_missing_action_eef: true

# P2 review numeric fixes (egodex has no arm-camera extrinsics; leave humanoid keys null)
review_corrections:
  extrinsic_rotation_correction:
    camera_top.T_ArmLeft_CameraTop: null
    camera_top.T_ArmRight_CameraTop: null
  gripper_closedness_correction:
    action: null
    state: null

quality_config_path: qwen-manip-preprocess/config/egodex_22T.yaml

# P7 export format (LeRobot dataset layout version)
export:
  lerobot_version: v3.0  # v2.1 | v3.0 | both
  renumber_episodes: true  # part_task also forces renumber; required for contiguous ids
  v30:
    data_file_size_in_mb: 100
    video_file_size_in_mb: 200

# P7 relative stats: eef pose required; arm joints optional (computed when present).
relative_statistics:
  enabled: true
  statistics_horizon_seconds: 2.0
