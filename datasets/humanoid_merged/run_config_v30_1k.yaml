dataset:
  name: humanoid_merged
  root: /mnt/public/algm/datasets/humanoid
  embodiment: humanoid
  fps: 30
  layout: single_root
  total_episodes: 46463

pipeline:
  num_workers: 64
  export_workers: 64
  output_mode: both
  force_skip_gate: true
  parallel_videos: true

media:
  target_short_side: 384
  max_keyframe_interval: 10
  require_camera_top: true

episode_geometry:
  enabled: true
  module: episode_geometry
  video_short_side: 384
  source_calibration_size: [1280, 720]
  cameras:
    reference: observation.images.camera_top
    aux:
      - observation.images.camera_wrist_left
      - observation.images.camera_wrist_right
    mapping:
      camera_reference: camera_top
      camera_aux_0: camera_wrist_left
      camera_aux_1: camera_wrist_right
    wrist_view: [camera_aux_0, camera_aux_1]
  extrinsics:
    reference_to_arm:
      left: camera_top.T_ArmLeft_CameraTop
      right: camera_top.T_ArmRight_CameraTop
    hand_eye:
      camera_aux_0: camera_top.T_ArmLeft_CameraWristLeft
      camera_aux_1: camera_top.T_ArmRight_CameraWristRight

speed_align:
  enabled: false

temporal_align:
  apply_delay: false
  mode: stats

stage2:
  fill_missing_action_eef: true

review_corrections:
  extrinsic_rotation_correction:
    camera_top.T_ArmLeft_CameraTop: null
    camera_top.T_ArmRight_CameraTop: null
  gripper_closedness_correction:
    action: {scale: -9.43, offset: 1.0}
    state: {scale: -10, offset: 1.0}

quality_config_path: qwen-manip-preprocess/config/humanoid_merged.yaml

export:
  lerobot_version: v3.0
  v30:
    data_file_size_in_mb: 100
    video_file_size_in_mb: 200
