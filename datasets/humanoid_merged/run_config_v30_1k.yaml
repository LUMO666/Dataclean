dataset:
  name: humanoid_merged
  root: /mnt/pfs/datasets/humanoid_merged/humanoid_merged
  embodiment: humanoid
  fps: 30
  layout: single_root
  total_episodes: 46475

pipeline:
  num_workers: 150
  export_workers: 150
  output_mode: both
  force_skip_gate: true
  parallel_videos: true
  recompute_video_stats: false
  sample_mode: sequential  # sequential | random
  ignore_episodes_paths:
    - /mnt/pfs/Data/liuweilin/Dataclean/datasets/humanoid_merged/ignore_no_calibration.json
    - /mnt/pfs/Data/liuweilin/Dataclean/datasets/humanoid_merged/extrinsic_outliers_full_v2.json

media:
  target_height: 384
  target_short_side: 384
  max_keyframe_interval: 10
  require_camera_top: true

episode_geometry:
  enabled: true
  module: episode_geometry
  episode_frame: "camera_reference at frame_index=0"
  video_short_side: 384
  source_calibration_size: [1280, 720]
  cameras:
    reference: observation.images.camera_top
    aux:
      - observation.images.camera_wrist_left
      - observation.images.camera_wrist_right
    mapping:
      camera_reference: camera_top
      camera_aux_0: camera_wrist_left
      camera_aux_1: camera_wrist_right
    wrist_view: [camera_aux_0, camera_aux_1]
  extrinsics:
    source: calibration_bundle_optimized.json
    reference_to_arm:
      left: camera_top.T_ArmLeft_CameraTop
      right: camera_top.T_ArmRight_CameraTop
    hand_eye:
      camera_aux_0: camera_top.T_ArmLeft_CameraWristLeft
      camera_aux_1: camera_top.T_ArmRight_CameraWristRight
    reference_is_fixed: true
  action:
    eef_source: observation.state.end.position
    eef_target_index: "min(t + lag, episode_length - 1)"
    eef_tail_policy: repeat final EEF state for tail rows
    joint_source: action.arm.position
    gripper_source: action.effector.position

speed_align:
  enabled: false
  golden_embodiment: humanoid
  golden_speed_mps: 0.08
  target_fps: 30

temporal_align:
  apply_delay: false
  mode: stats
  manual_delay: null

stage2:
  fill_missing_action_eef: true

review_corrections:
  extrinsic_rotation_correction:
    camera_top.T_ArmLeft_CameraTop: null
    camera_top.T_ArmRight_CameraTop: null
  gripper_closedness_correction:
    action: {scale: -9.43, offset: 1.0}
    state: {scale: -10, offset: 1.0}

quality_config_path: qwen-manip-preprocess/config/humanoid_merged.yaml

export:
  lerobot_version: v3.0
  renumber_episodes: true  # required for relative_statistics (0..N-1)
  v30:
    data_file_size_in_mb: 100
    video_file_size_in_mb: 200

relative_statistics:
  enabled: true
  statistics_horizon_seconds: 2.0
